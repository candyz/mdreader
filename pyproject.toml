[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdreader"
version = "0.9.9"
description = "Terminal Markdown reader with Mermaid flowchart rendering support"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=8.0.0",
    "rich>=14.0.0",
    "termaid>=0.8.0",
]

[project.scripts]
mdreader = "mdreader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
