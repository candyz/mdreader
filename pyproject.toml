[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mdreader"
version = "1.4.1"
description = "Terminal Markdown reader with Mermaid flowchart rendering support"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "textual>=8.0.0",
    "rich>=14.0.0",
    "termaid>=0.8.0",
    "pillow>=9.0.0",
    "resvg-py>=0.4.0;python_version>='3.10'",
]

[project.scripts]
mdreader = "mdreader.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
